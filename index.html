<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="document-title"></title>
    <link rel="stylesheet" href="style.css">
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
<div class="top-controls">
    <!-- Первая строка: заголовок + выбор темы + выбор языка -->
    <div class="top-header">
        <h1 id="page-title"></h1>
        <!-- Тёмная/светлая тема -->
        <button id="theme-toggle" aria-label="Toggle theme">🌓</button>
        <!-- Селектор языка интерфейса -->
        <select id="ui-lang-select"></select>
    </div>

    <!-- Вторая строка: фильтры по турам -->
    <div class="filter-row">
        <select id="filter-country"></select>
        <select id="filter-city"></select>
        <select id="filter-lang"></select>
    </div>
</div>

<div class="table-wrapper">
    <div id="root-map" style="height: 20vh; width: 80%; margin: 0 auto"></div>
    <table id="tours-table">
        <thead>
        <tr>
            <th id="th-flag"></th>
            <th id="th-name"></th>
            <th id="th-count"></th>
            <th id="th-length"></th>
            <th id="th-duration"></th>
        </tr>
        </thead>
        <tbody>
        <!-- rows… -->
        </tbody>
    </table>
</div>

<script>
    let LANG_FLAGS = {};
    let SUPPORTED_UI_LANGS = [];
    let locales = {};
    let strings = {};
    let tours = [];

    function fixViewportHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }

    window.addEventListener('resize', fixViewportHeight);
    fixViewportHeight();


    // 1) Загрузить флаги
    function loadFlags() {
        return fetch('js/langFlags.json')
            .then(r => r.json())
            .then(data => LANG_FLAGS = data);
    }

    // 2) Загрузить локали
    function loadLocales() {
        return fetch('js/locales.json')
            .then(r => r.json())
            .then(data => {
                locales = data;
                SUPPORTED_UI_LANGS = Object.keys(locales);
            });
    }

    // 3) Инициализация — ждём оба JSON
    Promise.all([loadFlags(), loadLocales()])
        .then(() => initInterface())
        .catch(console.error);

    function initInterface() {
        initTheme();
        initThemeToggle();
        initRootMap();

        const initLang = localStorage.getItem('uiLang') || SUPPORTED_UI_LANGS[0];
        if (!localStorage.getItem('uiLang')) {
            localStorage.setItem('uiLang', SUPPORTED_UI_LANGS[0]);
        }
        const uiSel = document.getElementById('ui-lang-select');
        uiSel.innerHTML = SUPPORTED_UI_LANGS.map(l =>
            `<option value="${l}"${l === initLang ? ' selected' : ''}>
         ${LANG_FLAGS[l]} ${l.toLowerCase()}
       </option>`
        ).join('');

        uiSel.addEventListener('change', e => {
            localStorage.setItem('uiLang', e.target.value);
            applyLanguage(e.target.value);
        });

        applyLanguage(initLang);
    }

    function applyLanguage(lang) {
        strings = locales[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = strings.rtl ? "rtl" : "ltr"
        document.getElementById('page-title').textContent = strings.all_tours;
        document.getElementById('document-title').textContent = strings.all_tours;
        document.title = strings.all_tours;

        loadTours().then(() => {
            // On load…
            renderInterface();
            renderFilters(lang);

            // навешиваем фильтры
            ['filter-country', 'filter-city', 'filter-lang']
                .forEach(id => document.getElementById(id).addEventListener('change', () => {
                    renderTable();
                    updateCityMarkers();
                }));

            renderTable();
            updateCityMarkers();
        });
    }

    function loadTours() {
        return fetch('js/tours.json')
            .then(r => r.json())
            .then(data => tours = data);
    }

    function renderInterface() {
        document.getElementById('th-name').textContent = strings.tour_name;
        document.getElementById('th-count').textContent = strings.stops_count;
        document.getElementById('th-length').textContent = strings.length_m;
        document.getElementById('th-duration').textContent = strings.duration_min;
    }

    function renderFilters(lang) {
        const unique = arr => Array.from(new Set(arr)).sort();
        const countries = unique(tours.map(t => t.country));
        const cities = unique(tours.map(t => t.city));
        const langs = unique(tours.map(t => t.language));

        const fill = (id, label, items) => {
            document.getElementById(id).innerHTML =
                `<option value="">${label}</option>` +
                items.map(v => `<option value="${v}">${v}</option>`).join('');
        };

        fill('filter-country', strings.country, countries);
        fill('filter-city', strings.city, cities);
        fill('filter-lang', strings.language, langs);

        const langFilter = document.getElementById('filter-lang');
        if (langFilter && langs.includes(lang)) {
            langFilter.value = lang;
        }
    }

    function renderTable() {
        const fC = document.getElementById('filter-country').value;
        const fCi = document.getElementById('filter-city').value;
        const fL = document.getElementById('filter-lang').value;
        const tbody = document.querySelector('#tours-table tbody');
        tbody.innerHTML = '';

        tours
            .filter(t => !fC || t.country === fC)
            .filter(t => !fCi || t.city === fCi)
            .filter(t => !fL || t.language === fL)
            .forEach(t => {
                const tr = document.createElement('tr');

                const flag = LANG_FLAGS[t.language] || '';
                const td = document.createElement('td');
                td.textContent = flag;
                tr.appendChild(td);

                // ячейка с флагом языка + названием
                const tdName = document.createElement('td');
                const a = document.createElement('a');
                a.textContent = t.title;
                a.href = `${t.id}/index.html`;
                a.title = t.description;
                tdName.appendChild(a);
                tr.appendChild(tdName);

                ['stops_count', 'length', 'duration'].forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = t[key];
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

    }

    //  Themes  ------------------------------------------------
    function initTheme() {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        applyTheme(theme);
    }

    function applyTheme(theme) {
        document.body.classList.toggle('dark', theme === 'dark');
        localStorage.setItem('theme', theme);
    }

    function initThemeToggle() {
        const btn = document.getElementById('theme-toggle');
        btn.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    }

    let rootMap, cityMarkers = [];

    // 1) Initialize map once
    function initRootMap() {
        rootMap = L.map('root-map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(rootMap);
    }

    // 2) Whenever you renderTable (or after filters change), rebuild the markers:
    function updateCityMarkers() {
        // clear old
        cityMarkers.forEach(m => rootMap.removeLayer(m));
        cityMarkers = [];

        const fL = document.getElementById('filter-lang').value;

        // filter tours same as renderTable
        const filtered = tours
            .filter(t => !fL || t.language === fL);

        // count per city
        const counts = {};
        filtered.forEach(t => {
            counts[t.city] = (counts[t.city] || 0) + 1;
        });

        // add a marker for each city
        Object.entries(counts).forEach(([city, count]) => {
            const { city_lat: lat, city_lon: lon } = tours.find(t => t.city === city);
            const marker = L.marker([lat, lon])
                .addTo(rootMap)
                .bindPopup(`${city}: ${count} tours`)
                .bindTooltip(String(count), {
                    permanent: true, direction: 'center',
                    className: 'number-label'
                });

            marker.on('click', () => {
                // 1) set the dropdown
                const citySel = document.getElementById('filter-city');
                citySel.value = city;

                // 2) re–render table and map
                renderTable();
                updateCityMarkers();

                // 3) if you want to open the popup with city name & count:
                marker.openPopup();
                rootMap.setView([lat, lon], 8)
            });

            cityMarkers.push(marker);
        });

        // adjust map to fit all markers
        if (cityMarkers.length > 1) {
            const group = L.featureGroup(cityMarkers);
            rootMap.fitBounds(group.getBounds(), {padding: [20, 20]});
        } else {
            rootMap.setView(cityMarkers[0].getLatLng(), 8)
        }
    }
</script>
</body>
</html>
