<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="document-title"></title>
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
<div class="page-container">
    <!-- Hero Header with Glassmorphism -->
    <header class="hero-header">
        <div class="glass-card header-content">
            <h1 id="page-title" class="title-gradient"></h1>
            <div class="header-controls">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
                    <span class="theme-icon">🌓</span>
                </button>
                <select id="ui-lang-select" class="glass-select"></select>
            </div>
        </div>
    </header>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="glass-card filter-container">
            <select id="filter-country" class="glass-select filter-item"></select>
            <select id="filter-city" class="glass-select filter-item"></select>
            <select id="filter-lang" class="glass-select filter-item"></select>
        </div>
    </section>

    <!-- Map Section -->
    <section class="map-section">
        <div class="glass-card map-container">
            <div id="root-map"></div>
        </div>
    </section>

    <!-- Tours Grid -->
    <section class="tours-section">
        <div class="tours-grid" id="tours-grid">
            <!-- Tour cards will be dynamically inserted here -->
        </div>
    </section>
</div>

<script>
    let LANG_FLAGS = {};
    let SUPPORTED_UI_LANGS = [];
    let locales = {};
    let strings = {};
    let tours = [];
    let rootMap = null;
    let cityMarkers = [];
    let mapInitialized = false;

    function fixViewportHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }

    window.addEventListener('resize', fixViewportHeight);
    fixViewportHeight();

    function loadFlags() {
        return fetch('js/langFlags.json')
            .then(r => r.json())
            .then(data => LANG_FLAGS = data);
    }

    function loadLocales() {
        return fetch('js/locales.json')
            .then(r => r.json())
            .then(data => {
                locales = data;
                SUPPORTED_UI_LANGS = Object.keys(locales);
            });
    }

    Promise.all([loadFlags(), loadLocales()])
        .then(() => initInterface())
        .catch(console.error);

    function initInterface() {
        initTheme();
        initThemeToggle();
        initRootMap();

        const currentState = getCurrentState();
        const initLang = localStorage.getItem('uiLang') || SUPPORTED_UI_LANGS[0];
        if (!localStorage.getItem('uiLang')) {
            localStorage.setItem('uiLang', SUPPORTED_UI_LANGS[0]);
        }

        const uiSel = document.getElementById('ui-lang-select');
        uiSel.innerHTML = SUPPORTED_UI_LANGS.map(l =>
            `<option value="${l}"${l === initLang ? ' selected' : ''}>
     ${LANG_FLAGS[l]} ${l.toUpperCase()}
   </option>`
        ).join('');

        uiSel.addEventListener('change', e => {
            localStorage.setItem('uiLang', e.target.value);
            const state = getCurrentState();
            applyState(state, e.target.value, true);
        });

        applyState(currentState, initLang);
    }

    function saveCurrentState() {
        const params = new URLSearchParams();
        const countryFilter = document.getElementById('filter-country').value;
        const cityFilter = document.getElementById('filter-city').value;
        const langFilter = document.getElementById('filter-lang').value;

        if (countryFilter) {
            params.set('filter-country', countryFilter);
            localStorage.setItem('filter-country', countryFilter);
        }
        if (cityFilter) {
            params.set('filter-city', cityFilter);
            localStorage.setItem('filter-city', cityFilter);
        }
        if (langFilter) {
            params.set('filter-lang', langFilter);
            localStorage.setItem('filter-lang', langFilter);
        }

        history.replaceState(null, '', '?' + params.toString());
    }

    function getCurrentState() {
        const params = new URLSearchParams(window.location.search);
        return {
            filter_country: params.get("filter-country"),
            filter_city: params.get("filter-city"),
            filter_lang: params.get("filter-lang")
        };
    }

    function applyState(state, uiLang, ignoreLangFilter = false) {
        strings = locales[uiLang];
        document.documentElement.lang = uiLang;
        document.documentElement.dir = strings.rtl ? "rtl" : "ltr";
        document.getElementById('page-title').textContent = strings.all_tours;
        document.getElementById('document-title').textContent = strings.all_tours;
        document.title = strings.all_tours;

        loadTours().then(() => {
            renderFilters(state, uiLang, ignoreLangFilter);

            ['filter-country', 'filter-city', 'filter-lang'].forEach(id => {
                const el = document.getElementById(id);
                el.replaceWith(el.cloneNode(true));
                document.getElementById(id).addEventListener('change', () => {
                    renderTourCards();
                    updateCityMarkers();
                    saveCurrentState();
                });
            });

            renderTourCards();

            if (mapInitialized && rootMap) {
                updateCityMarkers();
            } else {
                const checkMapReady = setInterval(() => {
                    if (mapInitialized && rootMap) {
                        clearInterval(checkMapReady);
                        updateCityMarkers();
                    }
                }, 100);
            }

            saveCurrentState();
        });
    }

    function loadTours() {
        return fetch('js/tours.json')
            .then(r => r.json())
            .then(data => {
                tours = data;
                console.log(`Loaded ${tours.length} tours`);
            });
    }

    function renderFilters(state, uiLang, ignoreLangFilter = false) {
        const unique = arr => Array.from(new Set(arr)).sort();
        const countries = unique(tours.map(t => t.country));
        const cities = unique(tours.map(t => t.city));
        const langs = unique(tours.map(t => t.language));

        const fill = (id, label, items) => {
            document.getElementById(id).innerHTML =
                `<option value="">${label}</option>` +
                items.map(v => `<option value="${v}">${v}</option>`).join('');
        };

        fill('filter-country', strings.country, countries);
        fill('filter-city', strings.city, cities);
        fill('filter-lang', strings.language, langs);

        const langFilter = document.getElementById('filter-lang');
        if (state.filter_lang && langs.includes(state.filter_lang) && !ignoreLangFilter) {
            langFilter.value = state.filter_lang;
        } else if (langFilter && langs.includes(uiLang)) {
            langFilter.value = uiLang;
        }

        if (state.filter_country && countries.includes(state.filter_country)) {
            document.getElementById('filter-country').value = state.filter_country;
        }

        if (state.filter_city && cities.includes(state.filter_city)) {
            document.getElementById('filter-city').value = state.filter_city;
        }
    }

    function renderTourCards() {
        const fC = document.getElementById('filter-country').value;
        const fCi = document.getElementById('filter-city').value;
        const fL = document.getElementById('filter-lang').value;
        const grid = document.getElementById('tours-grid');
        grid.innerHTML = '';

        const filtered = tours
            .filter(t => !fC || t.country === fC)
            .filter(t => !fCi || t.city === fCi)
            .filter(t => !fL || t.language === fL);

        filtered.forEach((t, idx) => {
            const card = document.createElement('div');
            card.className = 'tour-card glass-card';
            card.style.animationDelay = `${idx * 0.05}s`;

            const flag = LANG_FLAGS[t.language] || '';
            card.innerHTML = `
            <div class="tour-card-header">
                <span class="tour-flag">${flag}</span>
                <span class="tour-language">${t.language.toUpperCase()}</span>
            </div>
            <h3 class="tour-title"><a href="${t.id}/index.html">${t.title}</a></h3>
            <p class="tour-description">${t.description}</p>
            <div class="tour-stats">
                <div class="stat-item">
                    <span class="stat-icon">📍</span>
                    <span class="stat-value">${t.stops_count}</span>
                    <span class="stat-label">${strings.stops_count || 'Stops'}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">📏</span>
                    <span class="stat-value">${t.length}m</span>
                    <span class="stat-label">${strings.length_m || 'Length'}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">⏱️</span>
                    <span class="stat-value">${t.duration}min</span>
                    <span class="stat-label">${strings.duration_min || 'Duration'}</span>
                </div>
            </div>
        `;
            grid.appendChild(card);
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="no-results">No tours found</div>';
        }
    }

    function initTheme() {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        applyTheme(theme);
    }

    function applyTheme(theme) {
        document.body.classList.toggle('dark', theme === 'dark');
        localStorage.setItem('theme', theme);
    }

    function initThemeToggle() {
        const btn = document.getElementById('theme-toggle');
        if (!btn) return;

        let touching = false;

        const toggleTheme = () => {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        const resetButton = () => {
            btn.blur();
            btn.style.transform = '';
            touching = false;
        };

        btn.addEventListener('click', (e) => {
            if (!touching) {
                toggleTheme();
                setTimeout(resetButton, 150);
            }
        });

        btn.addEventListener('touchstart', (e) => {
            touching = true;
            e.preventDefault();
        }, {passive: false});

        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            toggleTheme();
            setTimeout(resetButton, 100);
        }, {passive: false});

        btn.addEventListener('touchcancel', resetButton);
    }

    function initRootMap() {
        const mapEl = document.getElementById('root-map');
        if (!mapEl) {
            console.error('Root map container not found');
            return;
        }

        mapEl.style.width = '100%';
        mapEl.style.height = '400px';
        mapEl.style.minHeight = '400px';

        setTimeout(() => {
            const rect = mapEl.getBoundingClientRect();
            console.log('Root map dimensions:', rect.width, 'x', rect.height);

            if (rect.width === 0 || rect.height === 0) {
                console.error('Map container still has no dimensions, retrying...');
                setTimeout(initRootMap, 200);
                return;
            }

            try {
                rootMap = L.map('root-map', {
                    zoomControl: true,
                    attributionControl: true,
                    trackResize: true
                }).setView([0, 0], 2);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                    maxZoom: 19,
                    keepBuffer: 2
                }).addTo(rootMap);

                setTimeout(() => rootMap.invalidateSize(true), 100);
                setTimeout(() => rootMap.invalidateSize(true), 300);
                setTimeout(() => {
                    rootMap.invalidateSize(true);
                    mapInitialized = true;
                    console.log('Root map initialized successfully');
                }, 500);

            } catch (error) {
                console.error('Error initializing root map:', error);
            }
        }, 100);

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (rootMap) {
                    rootMap.invalidateSize(true);
                    console.log('Root map resized');
                }
            }, 200);
        });
    }

    function updateCityMarkers() {
        if (!rootMap || !mapInitialized) {
            console.warn('Root map not initialized yet, skipping marker update');
            return;
        }

        if (!tours || tours.length === 0) {
            console.warn('No tours loaded yet');
            return;
        }

        cityMarkers.forEach(m => {
            try {
                rootMap.removeLayer(m);
            } catch (e) {
                console.warn('Error removing marker:', e);
            }
        });
        cityMarkers = [];

        const fC = document.getElementById('filter-country').value;
        const fCi = document.getElementById('filter-city').value;
        const fL = document.getElementById('filter-lang').value;

        const filtered = tours
            .filter(t => !fC || t.country === fC)
            .filter(t => !fCi || t.city === fCi)
            .filter(t => !fL || t.language === fL);

        console.log(`Showing ${filtered.length} filtered tours on map`);

        const counts = {};
        filtered.forEach(t => {
            if (t.city) {
                counts[t.city] = (counts[t.city] || 0) + 1;
            }
        });

        Object.entries(counts).forEach(([city, count]) => {
            const tour = tours.find(t => t.city === city);
            if (!tour || !tour.city_lat || !tour.city_lon) {
                console.warn(`Missing coordinates for city: ${city}`);
                return;
            }

            const {city_lat: lat, city_lon: lon} = tour;

            try {
                const marker = L.marker([lat, lon])
                    .addTo(rootMap)
                    .bindPopup(`<strong>${city}</strong><br>${count} tour${count > 1 ? 's' : ''}`)
                    .bindTooltip(String(count), {
                        permanent: true,
                        direction: 'center',
                        className: 'number-label'
                    });

                marker.on('click', () => {
                    document.getElementById('filter-city').value = city;
                    renderTourCards();
                    updateCityMarkers();
                    saveCurrentState();
                    marker.openPopup();
                    rootMap.setView([lat, lon], 10, {animate: true, duration: 0.5});
                });

                cityMarkers.push(marker);
                console.log(`Added marker for ${city} with ${count} tours`);
            } catch (error) {
                console.error(`Error creating marker for ${city}:`, error);
            }
        });

        if (cityMarkers.length > 1) {
            try {
                const group = L.featureGroup(cityMarkers);
                rootMap.fitBounds(group.getBounds(), {padding: [50, 50], animate: true});
            } catch (error) {
                console.error('Error fitting bounds:', error);
            }
        } else if (cityMarkers.length === 1) {
            const pos = cityMarkers[0].getLatLng();
            rootMap.setView(pos, 10, {animate: true});
        } else {
            console.log('No markers to display');
            rootMap.setView([0, 0], 2);
        }
    }
</script>
</body>
</html>
