
<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прогулка по еврейскому Казимежу</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="../style.css"></head>
<body>
  <div class="wrapper">
    <h1 id="title">Прогулка по еврейскому Казимежу</h1>
    <div id="scrollable">
      <div id="map"></div>
      <div id="info"></div>
    </div>
    <div class="navbar">
      <button class="nav" onclick="prevStop()">&larr;</button>
      <button class="nav" onclick="firstStop()">&circledcirc;</button>
      <button class="nav" onclick="nextStop()">&rarr;</button>
    </div>
  </div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/data.js"></script><script src="js/map.js"></script>
<script>
  function fixViewportHeight() {
    const vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
  }

  window.addEventListener('resize', fixViewportHeight);
  fixViewportHeight();
</script>
</body>
</html>
